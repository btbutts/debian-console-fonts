[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tools", ".github/actions-scripts"]
extend-exclude = ["sources", ".venv"]

[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM", "PL", "FURB", "RUF", "PTH",
          "PIE", "RET", "PERF", "TRY", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pylint.main]
ignore-paths = ["^sources/", "^.venv/"]
source-roots = ["tools", ".github/actions-scripts"]
# pylint E0401 does a real import; source-roots does not put these on sys.path.
# Works from this directory or from the OpenWRT workspace root.
init-hook = """
import sys
from pathlib import Path
cwd = Path.cwd()
for base in (cwd / "debian-console-fonts", cwd):
    tools = base / "tools"
    if (tools / "psf_font_maker").is_dir():
        sys.path.insert(0, str(tools))
        scripts = base / ".github" / "actions-scripts"
        if scripts.is_dir():
            sys.path.insert(0, str(scripts))
        break
"""

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
module-rgx = "^[a-zA-Z0-9_]+$"

[tool.pyright]
pythonVersion = "3.12"
include = ["tools", "tests", ".github/actions-scripts"]
extraPaths = ["tools", ".github/actions-scripts"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", ".github/actions-scripts"]
