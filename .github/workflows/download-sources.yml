name: download-sources

on:
  schedule:
    - cron: '0 0 1 * *'   # monthly, 00:00 UTC on the 1st
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["sources.json"]   # bumping a version in the manifest fetches it right away

jobs:
  download-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Prevents concurrent push/cron runs from conflicting on git operations
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: pip install requests

      - name: Download and unpack font sources
        id: sources
        run: python3 .github/actions-scripts/dependencyDownloader.py --sources sources.json

      # Skipped unless the script created or replaced something. Runs even if one
      # source failed, so the sources that did update are kept (the job still
      # ends red because the download step failed).
      - name: Commit and push if changed
        if: ${{ !cancelled() && steps.sources.outputs.changed == 'true' }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync sources (${{ steps.sources.outputs.changed_sources }}) [skip ci]"
          git push
