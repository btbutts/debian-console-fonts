# The symbols each code set needs, from console-setup's fontcodesets (GPL-2.0-or-later,
# Copyright Anton Zinoviev). Only symbols that matter are listed: for Lat2, for example,
# those that Lat15 does not already have. A font supports a set when it has at least
# 25 of its symbols. A set is either `symbols` (the code points, with their names as
# comments) or `same_as` (the name of another set that it equals).

