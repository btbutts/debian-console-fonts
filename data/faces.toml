# The console font faces, and which BDF fonts each is made from.
#
# This file belongs to this project and is edited by hand. It began as the data of
# console-setup 1.242~deb13u1's Fonts/Makefile (GPL-2.0-or-later, Copyright Anton Zinoviev
# and others); nothing reads that Makefile any more.
#
# A BDF named here is looked for in the upstream sources (sources/terminus-font,
# sources/ucs-fonts, sources/uni-vga) and then in bdf/ (see bdf/README.md). The DejaVu
# faces are not listed: they are rendered from the TrueType files.

# Ordinary faces. The BDFs of a face are listed with the highest priority first: when
# several define a symbol, the first one wins.
[faces]
Fixed13 = ["8x13-IL2.bdf", "8x13.bdf", "8x13c.bdf"]
Fixed14 = ["georgian14.bdf", "7x14-IL2.bdf", "7x14.bdf", "7x14c.bdf", "h14.bdf", "etl14-unicode.bdf"]
Fixed15 = ["9x15-IL2.bdf", "9x15.bdf", "9x15c.bdf"]
Fixed16 = ["georgian16.bdf", "unifont.bdf", "h16.bdf", "etl16-unicode.bdf"]
