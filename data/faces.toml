# VGA faces, whose fonts depend on the code set.
[legacy]
faces = ["VGA8", "VGA10", "VGA12", "VGA14", "VGA16", "VGA19", "VGA28x16", "VGA32x16"]

# The BDF a VGA face uses for a code set that has no list of its own.
[legacy.defaults]
VGA8 = "legacy8a.bdf"
VGA10 = "legacy10a.bdf"
VGA12 = "legacy12a.bdf"
VGA14 = "legacy14a.bdf"
VGA19 = "legacy19a.bdf"
VGA28x16 = "legacy14a-double.bdf"

# The code sets each VGA face is made for.
[legacy.codesets]
VGA8 = ["Arabic", "CyrKoi", "CyrSlav", "FullCyrSlav", "Greek", "FullGreek", "Hebrew", "Lat15", "Lat2", "Lat38", "Lat7", "Uni1", "Uni2"]
VGA10 = ["Lat15", "Lat2"]
VGA12 = ["Lat15", "Lat2"]
VGA14 = ["Arabic", "CyrKoi", "CyrSlav", "FullCyrSlav", "Greek", "FullGreek", "Hebrew", "Lat15", "Lat2", "Lat38", "Lat7", "Uni1", "Uni2"]
VGA16 = ["Arabic", "CyrKoi", "CyrSlav", "FullCyrSlav", "Greek", "FullGreek", "Hebrew", "Lat15", "Lat2", "Lat38", "Lat7", "Uni1", "Uni2"]
VGA19 = ["Lat15"]
VGA28x16 = ["Arabic", "CyrKoi", "CyrSlav", "FullCyrSlav", "Greek", "FullGreek", "Hebrew", "Lat15", "Lat2", "Lat38", "Lat7", "Uni1", "Uni2"]
VGA32x16 = ["Arabic", "CyrKoi", "CyrSlav", "FullCyrSlav", "Greek", "FullGreek", "Hebrew", "Lat15", "Lat2", "Lat38", "Lat7", "Uni1", "Uni2"]

# VGA faces drawn from one Uni-VGA font for every code set; scale 2 enlarges it twofold.
[legacy.uni_vga]
VGA16 = { font = "u_vga16.bdf", scale = 1 }
VGA32x16 = { font = "u_vga16.bdf", scale = 2 }

